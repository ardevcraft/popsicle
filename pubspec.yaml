name: popsicle
description: A compact Flutter state-management package built around explicit dependencies, reactive values, Stores, effects, and composable async state.
version: 3.0.0
homepage: https://github.com/ardevcraft/popsicle
repository: https://github.com/ardevcraft/popsicle
issue_tracker: https://github.com/ardevcraft/popsicle/issues
documentation: https://github.com/ardevcraft/popsicle/wiki
topics:
  - flutter
  - state-management
  - dependency-injection
  - reactive-programming
  - popsicle
screenshots:
  - description: 'Popsicle Package Icon'
    path: images/icon.png
  - description: 'Popsicle main philosophy image'
    path: images/philosophy.png
environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter
  meta: ^1.9.0
  stack_trace: ^1.10.0
  state_notifier: '>=0.7.2 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0
